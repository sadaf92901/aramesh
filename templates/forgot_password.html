<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراموشی رمز — همراه آرامش</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-container">

    <div class="login-header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="همراه آرامش" class="login-logo">
        <h1 class="login-title">فراموشی رمز عبور</h1>
    </div>

    <div class="form-container active">
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; line-height: 1.8;">
            ایمیل حسابت رو وارد کن.<br>
            لینک بازیابی برات ارسال میشه.
        </p>

        <div class="form-group">
            <label>📧 ایمیل</label>
            <input type="email" id="emailInput" placeholder="example@email.com" dir="ltr" autocomplete="email">
        </div>

        <button class="btn-submit btn-submit-primary" onclick="sendResetLink()" id="submitBtn">
            📧 ارسال لینک بازیابی
        </button>

        <div id="message" class="form-error"></div>

        <div id="debugInfo" style="display: none; margin-top: 16px; padding: 12px; background: #fef3c7; border-radius: 10px; font-size: 12px; color: #78350f; direction: ltr; word-break: break-all;">
            <!-- برای تست -->
        </div>

        <button class="btn-back" onclick="window.location.href='/'">↩️ بازگشت به ورود</button>
    </div>

</div>

<script>
function sendResetLink() {
    const email = document.getElementById('emailInput').value.trim();
    const msg = document.getElementById('message');
    const btn = document.getElementById('submitBtn');
    const debugInfo = document.getElementById('debugInfo');

    msg.textContent = '';
    msg.className = 'form-error';
    debugInfo.style.display = 'none';

    if (!email) {
        msg.textContent = '⚠️ ایمیل رو وارد کن';
        msg.className = 'form-error error';
        return;
    }

    btn.disabled = true;
    btn.textContent = '🔄 در حال ارسال...';

    fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
    })
    .then(res => res.json())
    .then(data => {
        btn.disabled = false;
        btn.textContent = '📧 ارسال لینک بازیابی';

        if (data.error) {
            msg.textContent = '❌ ' + data.error;
            msg.className = 'form-error error';
            return;
        }

        msg.textContent = '✅ ' + data.message;
        msg.className = 'form-error success';

        // ===== نمایش لینک (برای تست) =====
        if (data.debug_link) {
            debugInfo.style.display = 'block';
            debugInfo.innerHTML = `
                <strong>🔧 حالت تست:</strong><br>
                <a href="${data.debug_link}" style="color: #8B5CF6; font-weight: 700;">
                    کلیک کن برای تغییر رمز
                </a>
            `;
        }
    })
    .catch(() => {
        btn.disabled = false;
        btn.textContent = '📧 ارسال لینک بازیابی';
        msg.textContent = '❌ خطا در ارتباط با سرور';
        msg.className = 'form-error error';
    });
}

document.getElementById('emailInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendResetLink();
});
</script>

</body>
</html>
