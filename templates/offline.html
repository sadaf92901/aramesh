{% extends "base.html" %}

{% block content %}

<div class="page active" id="pageOffline">

    <div class="error-page">
        <div class="error-page-icon">📡</div>
        <h1 class="error-page-title">آفلاین هستی</h1>
        <p class="error-page-message">
            اتصال به اینترنت قطع شده.
            <br>
            بعضی از امکانات اپ هنوز کار می‌کنن:
        </p>

        <div style="text-align: right; max-width: 400px; margin: 20px auto; padding: 16px; background: #f8fafc; border-radius: 14px; border: 1px solid #e2e8f0;">
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e2e8f0;">
                <span style="font-size: 20px;">✅</span>
                <span style="font-size: 14px; color: #475569;">مشاهده‌ی وضعیت روزانه</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e2e8f0;">
                <span style="font-size: 20px;">✅</span>
                <span style="font-size: 14px; color: #475569;">تمرین تنفس</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e2e8f0;">
                <span style="font-size: 20px;">✅</span>
                <span style="font-size: 14px; color: #475569;">مدیتیشن</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0;">
                <span style="font-size: 20px;">⚠️</span>
                <span style="font-size: 14px; color: #94a3b8;">تشخیص، چت‌بات، تاریخچه</span>
            </div>
        </div>

        <button class="error-page-btn" onclick="window.location.reload()">
            🔄 تلاش مجدد
        </button>
    </div>

</div>

{% endblock %}
