<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز — همراه آرامش</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-container">

    <div class="login-header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="همراه آرامش" class="login-logo">
        <h1 class="login-title">تغییر رمز عبور</h1>
    </div>

    <div class="form-container active">
        <div class="form-group">
            <label>🔒 رمز جدید</label>
            <input type="password" id="newPassword" placeholder="حداقل ۸ کاراکتر" dir="ltr">
            <small style="color: #94a3b8; font-size: 12px;">شامل حرف بزرگ، کوچک و عدد</small>
        </div>

        <div class="form-group">
            <label>🔒 تکرار رمز جدید</label>
            <input type="password" id="confirmPassword" placeholder="رمز جدید رو تکرار کن" dir="ltr">
        </div>

        <button class="btn-submit btn-submit-primary" onclick="resetPassword()" id="submitBtn">
            ✅ تغییر رمز
        </button>

        <div id="message" class="form-error"></div>

        <button class="btn-back" onclick="window.location.href='/'">↩️ بازگشت به ورود</button>
    </div>

</div>

<script>
function resetPassword() {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const msg = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    msg.textContent = '';
    msg.className = 'form-error';

    // ===== گرفتن توکن از URL =====
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
        msg.textContent = '❌ توکن بازیابی پیدا نشد';
        msg.className = 'form-error error';
        return;
    }

    if (!newPass || !confirmPass) {
        msg.textContent = '⚠️ همه‌ی فیلدها رو پر کن';
        msg.className = 'form-error error';
        return;
    }

    if (newPass !== confirmPass) {
        msg.textContent = '⚠️ رمزها یکسان نیستن';
        msg.className = 'form-error error';
        return;
    }

    btn.disabled = true;
    btn.textContent = '🔄 در حال تغییر...';

    fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: newPass })
    })
    .then(res => res.json())
    .then(data => {
        btn.disabled = false;
        btn.textContent = '✅ تغییر رمز';

        if (data.error) {
            msg.textContent = '❌ ' + data.error;
            msg.className = 'form-error error';
            return;
        }

        msg.textContent = '✅ رمز با موفقیت تغییر کرد! در حال انتقال...';
        msg.className = 'form-error success';

        setTimeout(() => {
            window.location.href = '/login';
        }, 1500);
    })
    .catch(() => {
        btn.disabled = false;
        btn.textContent = '✅ تغییر رمز';
        msg.textContent = '❌ خطا در ارتباط با سرور';
        msg.className = 'form-error error';
    });
}
</script>

</body>
</html>
