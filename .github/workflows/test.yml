name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Setup environment
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "FLASK_ENV=testing" >> $GITHUB_ENV
          echo "LLM_ENABLED=false" >> $GITHUB_ENV
          echo "SPEECH_ENABLED=false" >> $GITHUB_ENV
          echo "RAG_ENABLED=false" >> $GITHUB_ENV
          echo "EMAIL_ENABLED=false" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest tests/ -v \
            --ignore=tests/test_llm.py \
            --ignore=tests/test_speech.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
        continue-on-error: true